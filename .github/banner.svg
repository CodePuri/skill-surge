<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f0f23"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFFF"/>
      <stop offset="100%" style="stop-color:#00BFFF"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6EC7"/>
      <stop offset="100%" style="stop-color:#FF00FF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFA500"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#39FF14"/>
      <stop offset="100%" style="stop-color:#00FF7F"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowstrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)" rx="12"/>

  <!-- Grid lines (synthwave) -->
  <g opacity="0.15" stroke="#FF00FF" stroke-width="0.5">
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="130" x2="800" y2="130"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="70" x2="800" y2="70"/>
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="100" y1="160" x2="100" y2="200"/>
    <line x1="200" y1="160" x2="200" y2="200"/>
    <line x1="300" y1="160" x2="300" y2="200"/>
    <line x1="400" y1="160" x2="400" y2="200"/>
    <line x1="500" y1="160" x2="500" y2="200"/>
    <line x1="600" y1="160" x2="600" y2="200"/>
    <line x1="700" y1="160" x2="700" y2="200"/>
  </g>

  <!-- Sun/horizon -->
  <circle cx="400" cy="160" r="50" fill="url(#pink)" opacity="0.3" filter="url(#glowstrong)"/>
  <circle cx="400" cy="160" r="35" fill="url(#pink)" opacity="0.5"/>

  <!-- Top title -->
  <text x="400" y="42" font-family="'Courier New', monospace" font-size="26" font-weight="bold"
        fill="url(#pink)" text-anchor="middle" filter="url(#glow)" letter-spacing="8">
    SKILL SURGE
  </text>

  <!-- Subtitle -->
  <text x="400" y="65" font-family="'Courier New', monospace" font-size="12"
        fill="url(#cyan)" text-anchor="middle" opacity="0.9" letter-spacing="3">
    PLUG-AND-PLAY AGENT INTELLIGENCE
  </text>

  <!-- Divider -->
  <line x1="100" y1="75" x2="700" y2="75" stroke="url(#cyan)" stroke-width="1" opacity="0.4"/>

  <!-- Tagline -->
  <text x="400" y="92" font-family="'Courier New', monospace" font-size="10"
        fill="#b0b0b0" text-anchor="middle" letter-spacing="1">
    29 skills • 3-phase detection • 11+ agents • keyboard-driven UI
  </text>

  <!-- Command box -->
  <rect x="180" y="100" width="440" height="36" rx="6" fill="none"
        stroke="url(#cyan)" stroke-width="1.5" opacity="0.7"/>
  <text x="400" y="122" font-family="'Courier New', monospace" font-size="14"
        fill="url(#green)" text-anchor="middle" filter="url(#glow)">
    npm install -g skill-surge
  </text>

  <!-- Badges -->
  <rect x="140" y="148" width="90" height="20" rx="4" fill="url(#pink)" opacity="0.2"/>
  <text x="185" y="162" font-family="'Courier New', monospace" font-size="9" fill="#FF6EC7" text-anchor="middle">29 SKILLS</text>

  <rect x="240" y="148" width="90" height="20" rx="4" fill="url(#cyan)" opacity="0.2"/>
  <text x="285" y="162" font-family="'Courier New', monospace" font-size="9" fill="#00FFFF" text-anchor="middle">3-PHASE DETECT</text>

  <rect x="340" y="148" width="90" height="20" rx="4" fill="url(#gold)" opacity="0.2"/>
  <text x="385" y="162" font-family="'Courier New', monospace" font-size="9" fill="#FFD700" text-anchor="middle">11+ AGENTS</text>

  <rect x="440" y="148" width="90" height="20" rx="4" fill="url(#green)" opacity="0.2"/>
  <text x="485" y="162" font-family="'Courier New', monospace" font-size="9" fill="#39FF14" text-anchor="middle">KEYBOARD UI</text>

  <rect x="540" y="148" width="90" height="20" rx="4" fill="#7B68EE" opacity="0.2"/>
  <text x="585" y="162" font-family="'Courier New', monospace" font-size="9" fill="#7B68EE" text-anchor="middle">MIT LICENSE</text>

  <!-- Version -->
  <text x="780" y="25" font-family="'Courier New', monospace" font-size="10"
        fill="url(#gold)" text-anchor="end" opacity="0.8">
    v2.2.3
  </text>
</svg>